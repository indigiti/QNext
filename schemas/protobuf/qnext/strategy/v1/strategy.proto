syntax = "proto3";

package qnext.strategy.v1;

option go_package = "github.com/indigiti/QNext/gen/go/qnext/strategy/v1;strategyv1";

message StrategySignal {
  string signal_id = 1;
  string strategy_name = 2;
  string strategy_version = 3;
  string instrument_id = 4;
  string timeframe = 5;
  string action = 6;
  int64 signal_time_ms = 7;
  string prediction_id = 8;
}

message Order {
  string order_id = 1;
  string account_id = 2;
  string instrument_id = 3;
  string side = 4;
  string order_type = 5;
  double quantity = 6;
  double limit_price = 7;
  double stop_price = 8;
  string state = 9;
  int64 created_at_ms = 10;
  string strategy_version = 11;
  string model_version = 12;
}

message Fill {
  string fill_id = 1;
  string order_id = 2;
  double quantity = 3;
  double price = 4;
  double fees = 5;
  int64 filled_at_ms = 6;
}

message Position {
  string position_id = 1;
  string account_id = 2;
  string instrument_id = 3;
  double quantity = 4;
  double average_price = 5;
  double realized_pnl = 6;
  double unrealized_pnl = 7;
  int64 as_of_time_ms = 8;
}

message Trade {
  string trade_id = 1;
  string instrument_id = 2;
  string strategy_version = 3;
  string model_version = 4;
  int64 entry_time_ms = 5;
  int64 exit_time_ms = 6;
  double quantity = 7;
  double entry_price = 8;
  double exit_price = 9;
  double pnl = 10;
  double fees = 11;
  double max_drawdown = 12;
  double max_runup = 13;
}

message BacktestRun {
  string run_id = 1;
  string strategy_version = 2;
  string model_version = 3;
  string instrument_id = 4;
  string timeframe = 5;
  int64 from_ms = 6;
  int64 to_ms = 7;
  string dataset_hash = 8;
  string execution_model_version = 9;
  string status = 10;
}

message StrategyManifest {
  string strategy_name = 1;
  string strategy_version = 2;
  string definition_hash = 3;
  string execution_model_version = 4;
  int64 created_at_ms = 5;
}
