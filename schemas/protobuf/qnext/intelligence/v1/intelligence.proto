syntax = "proto3";

package qnext.intelligence.v1;

option go_package = "github.com/indigiti/QNext/gen/go/qnext/intelligence/v1;intelligencev1";

message FeatureValue {
  string name = 1;
  double value = 2;
}

message FeatureVector {
  string feature_set_version = 1;
  string instrument_id = 2;
  string timeframe = 3;
  int64 as_of_time_ms = 4;
  repeated FeatureValue features = 5;
  string snapshot_hash = 6;
  string data_quality = 7;
}

message Prediction {
  string prediction_id = 1;
  string instrument_id = 2;
  string timeframe = 3;
  int64 prediction_time_ms = 4;
  string feature_set_version = 5;
  string feature_snapshot_hash = 6;
  string model_name = 7;
  string model_version = 8;
  string model_hash = 9;
  string regime = 10;
  string direction = 11;
  map<string, double> probabilities = 12;
  uint32 horizon_bars = 13;
  string data_quality = 14;
  string state = 15;
  string decision_context_hash = 16;
}

message Outcome {
  string prediction_id = 1;
  double return_value = 2;
  double mfe = 3;
  double mae = 4;
  string direction_actual = 5;
  bool correct = 6;
  int64 evaluated_at_ms = 7;
}

message ModelManifest {
  string model_name = 1;
  string model_version = 2;
  string lifecycle_state = 3;
  string feature_set_version = 4;
  string dataset_hash = 5;
  string model_hash = 6;
  string algorithm = 7;
  int64 training_window_start_ms = 8;
  int64 training_window_end_ms = 9;
  int64 created_at_ms = 10;
  int64 promoted_at_ms = 11;
  int64 retired_at_ms = 12;
}
