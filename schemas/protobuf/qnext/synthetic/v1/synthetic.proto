syntax = "proto3";

package qnext.synthetic.v1;

option go_package = "github.com/indigiti/QNext/gen/go/qnext/synthetic/v1;syntheticv1";

message SyntheticDefinition {
  string synthetic_id = 1;
  string version = 2;
  string underlying_instrument_id = 3;
  string expiry_policy = 4;
  string atm_policy = 5;
  double strike_interval = 6;
  repeated int32 strike_offsets = 7;
  string leg_price_field = 8;
  uint32 max_leg_age_ms = 9;
  uint32 max_leg_time_skew_ms = 10;
  uint32 minimum_valid_candidates = 11;
  string aggregation = 12;
}

message SyntheticCandidate {
  double strike = 1;
  double call_price = 2;
  double put_price = 3;
  double value = 4;
  int64 call_event_time_ms = 5;
  int64 put_event_time_ms = 6;
  bool accepted = 7;
  string rejection_reason = 8;
}

message SyntheticObservation {
  string synthetic_id = 1;
  string definition_version = 2;
  int64 event_time_ms = 3;
  double value = 4;
  string quality = 5;
  repeated SyntheticCandidate candidates = 6;
}
