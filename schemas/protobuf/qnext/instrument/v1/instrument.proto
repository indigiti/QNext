syntax = "proto3";

package qnext.instrument.v1;

option go_package = "github.com/indigiti/QNext/gen/go/qnext/instrument/v1;instrumentv1";

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_INDEX = 1;
  ASSET_CLASS_EQUITY = 2;
  ASSET_CLASS_FUTURE = 3;
  ASSET_CLASS_OPTION = 4;
  ASSET_CLASS_FOREX = 5;
  ASSET_CLASS_CRYPTO = 6;
  ASSET_CLASS_SYNTHETIC = 7;
}

message Instrument {
  string instrument_id = 1;
  string symbol = 2;
  string name = 3;
  AssetClass asset_class = 4;
  string exchange = 5;
  string currency = 6;
  string timezone = 7;
  string tick_size = 8;
  string lot_size = 9;
  bool active = 10;
}

message ProviderInstrument {
  string instrument_id = 1;
  string provider = 2;
  string provider_instrument_id = 3;
  string provider_symbol = 4;
  map<string, string> metadata = 5;
  bool enabled = 6;
}

message MarketStatus {
  string instrument_id = 1;
  string state = 2;
  int64 observed_at_ms = 3;
  int64 session_open_ms = 4;
  int64 session_close_ms = 5;
}

message ProviderHealth {
  string provider = 1;
  string state = 2;
  int64 observed_at_ms = 3;
  int64 last_tick_age_ms = 4;
  double latency_ms = 5;
  double gap_rate = 6;
  double error_rate = 7;
  uint64 reconnect_count = 8;
}
