syntax = "proto3";

package qnext.market.v1;

option go_package = "github.com/indigiti/QNext/gen/go/qnext/market/v1;marketv1";

enum DataQuality {
  DATA_QUALITY_UNSPECIFIED = 0;
  DATA_QUALITY_GOOD = 1;
  DATA_QUALITY_RECOVERED = 2;
  DATA_QUALITY_PARTIAL = 3;
  DATA_QUALITY_STALE = 4;
  DATA_QUALITY_DEGRADED = 5;
  DATA_QUALITY_INVALID = 6;
}

message CanonicalTick {
  string schema = 1;               // QNEXT.MARKET.TICK/1
  string instrument_id = 2;        // e.g. NSE:NIFTY50
  string provider = 3;
  double price = 4;
  int64 event_time_ms = 5;
  int64 received_time_ms = 6;
  int64 processed_time_ms = 7;
  int64 published_time_ms = 8;
  uint64 sequence = 9;
  DataQuality quality = 10;
}

message Bar {
  string schema = 1;               // QNEXT.MARKET.BAR/1
  string instrument_id = 2;
  string timeframe = 3;
  int64 open_time_ms = 4;
  int64 close_time_ms = 5;
  double open = 6;
  double high = 7;
  double low = 8;
  double close = 9;
  double volume = 10;
  bool final = 11;
  uint32 revision = 12;
  string authority_provider = 13;
  DataQuality quality = 14;
  bool recovered = 15;
  bool corrected = 16;
  string candle_engine_version = 17;
  string synthetic_version = 18;
}

message AuthorityTransition {
  string instrument_id = 1;
  string from_provider = 2;
  string to_provider = 3;
  string reason = 4;
  int64 event_time_ms = 5;
  string authority_policy_version = 6;
}
