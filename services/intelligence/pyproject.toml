[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnext-intelligence"
version = "0.3.0"
description = "Leakage-safe Python intelligence runtime for QNext canonical market data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qnext-intelligence = "qnext_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
