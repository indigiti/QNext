name: QNext temporary volume gofmt
on:
  push:
    branches:
      - feat/volume-ledger-reconciliation-20261023
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/volume-ledger-reconciliation-20261023'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/volume-ledger-reconciliation-20261023
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/market-core/go.mod
      - name: Format only Go
        run: |
          gofmt -w services/market-core/cmd/qnext-market-core/main.go
          gofmt -w services/market-core/internal/stream/volume_alias.go
          gofmt -w services/market-core/internal/stream/unified_syn_volume_test.go
          gofmt -w services/market-core/internal/stream/websocket.go
          gofmt -w services/market-core/internal/volumeledger/*.go
      - name: Commit formatting to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core/
          if ! git diff --cached --quiet; then
            git commit -m "style(volume): gofmt final ledger and stream reconciliation"
            git push origin HEAD:feat/volume-ledger-reconciliation-20261023
          fi
