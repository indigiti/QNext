name: Temporary futures renew gofmt

on:
  push:
    branches:
      - fix/auto-recover-enabled-futures-volume
    paths:
      - ".github/workflows/temporary-futures-renew-gofmt.yml"
      - "services/market-core/internal/volumeproxy/manager.go"
      - "services/market-core/internal/volumeproxy/manager_auto_renew_test.go"
      - "services/market-core/internal/provider/upstox/subscription_state.go"
      - "services/market-core/internal/provider/upstox/subscription_renew_test.go"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-recover-enabled-futures-volume
          persist-credentials: true
      - name: Format exact changed Go files
        run: |
          gofmt -w services/market-core/internal/volumeproxy/manager.go
          gofmt -w services/market-core/internal/volumeproxy/manager_auto_renew_test.go
          gofmt -w services/market-core/internal/provider/upstox/subscription_state.go
          gofmt -w services/market-core/internal/provider/upstox/subscription_renew_test.go
          if git diff --quiet -- services/market-core; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core/internal/volumeproxy/manager.go
          git add services/market-core/internal/volumeproxy/manager_auto_renew_test.go
          git add services/market-core/internal/provider/upstox/subscription_state.go
          git add services/market-core/internal/provider/upstox/subscription_renew_test.go
          git commit -m "style: gofmt targeted futures auto-renew"
          git push origin HEAD:fix/auto-recover-enabled-futures-volume
