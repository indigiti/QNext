name: Temporary gofmt live-feed branch

on:
  push:
    branches:
      - fix/live-forming-candle-polling

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-forming-candle-polling
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          cd services/market-core
          gofmt -w \
            cmd/qnext-market-core/main.go \
            cmd/qnext-market-core/main_test.go \
            internal/marketconfig/config.go \
            internal/marketconfig/auto_test.go \
            internal/provider/upstox/wire.go \
            internal/provider/upstox/wire_test.go \
            internal/httpapi/server.go \
            internal/httpapi/server_test.go \
            internal/stream/broker.go \
            internal/stream/broker_test.go
          cd ../..
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style: gofmt live-feed recovery changes"
          git push origin HEAD:fix/live-forming-candle-polling
