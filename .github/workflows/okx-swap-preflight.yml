name: OKX XAU-USDT-SWAP live preflight
on:
  push:
    branches:
      - feature/okx-xau-usdt-swap-20261123
    paths:
      - "services/market-core/internal/provider/okx/**"
      - ".github/workflows/okx-swap-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.mod
      - name: Test real OKX XAU-USDT-SWAP contract
        env:
          QNEXT_OKX_SWAP_SMOKE: "1"
        run: go test ./internal/provider/okx -run '^TestLiveOKXSwapMetadata$' -count=1 -v -timeout=45s
