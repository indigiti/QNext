name: Q0 Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - q0-foundation

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required Q0 files
        shell: bash
        run: |
          set -euo pipefail
          make q0-check

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install pinned Buf CLI
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/q0-bin"
          mkdir -p "$GOBIN"
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Lint Protobuf contracts
        run: buf lint

      - name: Validate golden fixtures
        run: python3 tools/q0_validate.py

      - name: Reject legacy schema namespace
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "QSYN.MARKET" schemas; then
            echo "Legacy QSYN schema namespace found"
            exit 1
          fi

      - name: Certify canonical Market Core port references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"market_core_url": "http://127.0.0.1:18080"' config/q3-intelligence.example.json
          grep -Fq 'QNEXT_MARKET_CORE_URL:=http://127.0.0.1:18080' deploy/qnext-ops-helper
          if grep -F '127.0.0.1:8080' config/q3-intelligence.example.json deploy/qnext-ops-helper services/ops-api/README.md; then
            echo "Legacy Market Core port 8080 found in active configuration or runtime documentation"
            exit 1
          fi
