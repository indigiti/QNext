name: Q6 Web Ops

on:
  pull_request:
    paths:
      - "apps/ops-console/**"
      - "services/ops-api/**"
      - "deploy/**"
      - ".github/workflows/qnext-release.yml"
      - ".github/workflows/q6-web-ops.yml"
      - "docs/architecture/q6-web-ops-deployment.md"
  push:
    branches:
      - q6-web-ops-console
    paths:
      - "apps/ops-console/**"
      - "services/ops-api/**"
      - "deploy/**"
      - ".github/workflows/qnext-release.yml"
      - ".github/workflows/q6-web-ops.yml"
      - "docs/architecture/q6-web-ops-deployment.md"

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ops-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify packaged Admin routes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/api/index.php
          for route in dashboard market-data candles-history synthetic indicators-intelligence runtime releases diagnostics settings security; do
            test -s "dist/${route}/index.html"
            grep -Fq '/qnext/admin/assets/' "dist/${route}/index.html"
          done

  php-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find services/ops-api -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l apps/ops-console/public/api/index.php
      - name: Helper syntax
        run: |
          bash -n deploy/qnext-ops-helper
          bash -n deploy/qnext-ops-web
          bash -n deploy/qnext-ops-user
          bash -n deploy/qnext-intelligence-lab-python
      - name: Lab ML runtime fallback smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          if QNEXT_PRIVATE_ROOT="$root" bash deploy/qnext-intelligence-lab-python status; then
            echo "empty Lab ML runtime unexpectedly reported READY" >&2
            exit 1
          fi
          test -s "$root/run/intelligence-lab-python.json"
          grep -Fq '"state":"UNAVAILABLE"' "$root/run/intelligence-lab-python.json"
          rm -rf "$root"

      - name: PHP smoke
        run: |
          php services/ops-api/tests/smoke.php
          php services/ops-api/tests/auth_migration.php
          php services/ops-api/tests/auth_session.php
      - name: Reject generic shell execution surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'shell_exec\(|passthru\(|system\(|exec\(' services/ops-api

  lab-ml-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build local Lab ML wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/intelligence-lab-wheels"
          printf '%s\n'             'scikit-learn==1.9.1'             'lightgbm==4.7.0'             > "$root/intelligence-lab-wheels/requirements.lock"
          python -m pip download             --disable-pip-version-check             --only-binary=:all:             --dest "$root/intelligence-lab-wheels"             -r "$root/intelligence-lab-wheels/requirements.lock"
          (
            cd "$root/intelligence-lab-wheels"
            sha256sum requirements.lock *.whl > wheelhouse.sha256
            sha256sum -c wheelhouse.sha256
          )
          QNEXT_PRIVATE_ROOT="$root"             QNEXT_LAB_BOOTSTRAP_PYTHON=python             deploy/qnext-intelligence-lab-python bootstrap > "$root/python-path"
          lab_python="$(cat "$root/python-path")"
          test -x "$lab_python"
          "$lab_python" - <<'PY'
          import lightgbm
          import sklearn
          assert sklearn.__version__ == "1.9.1"
          assert lightgbm.__version__ == "4.7.0"
          PY
          second="$(
            QNEXT_PRIVATE_ROOT="$root"               QNEXT_LAB_BOOTSTRAP_PYTHON=python               deploy/qnext-intelligence-lab-python bootstrap
          )"
          test "$second" = "$lab_python"
          grep -Fq '"state":"READY"' "$root/run/intelligence-lab-python.json"
          rm -rf "$root"

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify full release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name: digiops-release' .github/workflows/qnext-release.yml
          grep -q 'release/private/bin/qnext-market-core' .github/workflows/qnext-release.yml
          grep -q 'release/private/bin/qnext-data-collector' .github/workflows/qnext-release.yml
          grep -q 'qnext-data-collector.current' .github/workflows/qnext-release.yml
          grep -q './cmd/qnext-data-collector' .github/workflows/qnext-release.yml
          grep -q 'release/public/admin' .github/workflows/qnext-release.yml
          grep -q 'release/public/admin/api/index.php' .github/workflows/qnext-release.yml
          grep -q 'services/ops-api' .github/workflows/qnext-release.yml
          grep -q 'QNEXT.RELEASE/1' .github/workflows/qnext-release.yml
          test -x deploy/qnext-ops-helper
          test -x deploy/qnext-ops-web
          test -f deploy/qnext-intelligence-lab-python
          grep -q 'intelligence-lab-wheels' .github/workflows/qnext-release.yml
          grep -q 'qnext-intelligence-lab-python' .github/workflows/qnext-release.yml
