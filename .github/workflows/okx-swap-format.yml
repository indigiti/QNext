name: OKX swap feature formatting
on:
  push:
    branches:
      - feature/okx-xau-usdt-swap-20261123
    paths:
      - ".github/workflows/okx-swap-format.yml"
      - "services/market-core/cmd/qnext-market-core/okx_swap_registration_test.go"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/okx-xau-usdt-swap-20261123
      - name: Format new OKX swap Go files
        run: |
          gofmt -w services/market-core/internal/provider/okx/marketdata.go \
            services/market-core/internal/provider/okx/stream.go \
            services/market-core/internal/provider/okx/swap_test.go \
            services/market-core/internal/provider/okx/swap_metadata_live_test.go \
            services/market-core/cmd/qnext-market-core/okx_xauusd.go \
            services/market-core/cmd/qnext-market-core/okx_admin_config.go \
            services/market-core/cmd/qnext-market-core/okx_admin_config_test.go \
            services/market-core/cmd/qnext-market-core/okx_swap_registration_test.go \
            services/market-core/cmd/qnext-market-core/main.go
      - name: Commit formatting on feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/market-core; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style(okx): gofmt independent XAU-USDT-SWAP feed"
          git push origin HEAD:feature/okx-xau-usdt-swap-20261123
