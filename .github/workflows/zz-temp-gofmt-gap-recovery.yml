name: Temporary gofmt auto gap recovery

on:
  push:
    branches:
      - q6-auto-gap-recovery

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6-auto-gap-recovery
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          cd services/market-core
          gofmt -w             internal/provider/upstox/gap_recovery_status.go             internal/provider/upstox/intraday_recovery_test.go             internal/provider/upstox/supervisor.go             internal/provider/upstox/supervisor_test.go             internal/stream/broker_test.go             internal/stream/websocket_test.go
          cd ../..
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style: gofmt automatic gap recovery"
          git push origin HEAD:q6-auto-gap-recovery
