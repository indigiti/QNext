name: Temporary gofmt historical repair

on:
  push:
    branches:
      - q6-historical-repair-windows

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6-historical-repair-windows
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          cd services/market-core
          gofmt -w             internal/candle/engine_test.go             internal/httpapi/server.go             internal/provider/upstox/historical.go             internal/provider/upstox/historical_repair.go             internal/provider/upstox/historical_repair_test.go
          cd ../..
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style: gofmt historical repair changes"
          git push origin HEAD:q6-historical-repair-windows
