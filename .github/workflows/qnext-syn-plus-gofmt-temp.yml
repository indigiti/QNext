name: QNext SYN+ Direct Proxy One-Time Format
on:
  push:
    branches:
      - fix/staging-syn-plus-direct-proxy-volume-20261028
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/fix/staging-syn-plus-direct-proxy-volume-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/staging-syn-plus-direct-proxy-volume-20261028
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/market-core/go.mod
      - name: Format modified Go files
        run: |
          gofmt -w services/market-core/internal/stream/broker.go
          gofmt -w services/market-core/internal/stream/websocket.go
          gofmt -w services/market-core/internal/stream/syn_plus_direct_proxy_test.go
          gofmt -w services/market-core/internal/runtime/market_sink.go
      - name: Commit to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core/
          if ! git diff --cached --quiet; then
            git commit -m "style(syn+): gofmt direct futures volume observers"
            git push origin HEAD:fix/staging-syn-plus-direct-proxy-volume-20261028
          fi
