name: One-time merged-branch cleanup

on:
  push:
    branches: [fix/auto-recover-enabled-futures-volume]
    paths: [".github/workflows/temporary-cleanup-merged-branch.yml"]

permissions:
  contents: write

jobs:
  delete-merged-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-recover-enabled-futures-volume
          persist-credentials: true
      - name: Delete verified merged feature branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/live-market-integrity-monitor
          expected=8e3760560d10d6594e90f1e07d5d656ca05340e7
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ -z "$actual" ]; then
            echo "Branch already deleted"
            exit 0
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Branch SHA changed after merge; refusing deletion"
            exit 1
          fi
          git push origin --delete "$branch"
