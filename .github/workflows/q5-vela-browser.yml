name: Q5 Vela Browser

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/architecture/q5-vela-*.md"
      - ".github/workflows/q5-vela-browser.yml"
  push:
    branches: [main, q5-vela-mainline]
    paths:
      - "apps/web/**"
      - "docs/architecture/q5-vela-*.md"
      - ".github/workflows/q5-vela-browser.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
