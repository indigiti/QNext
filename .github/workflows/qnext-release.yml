name: QNext Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qnext-release-main
  cancel-in-progress: true

jobs:
  build-release:
    name: Build DigiOps release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Provider tests
        run: npm test

      - name: Verify Vela runtime parity
        run: npm run vela:parity

      - name: Build static workspace
        run: npm run build

      - name: Add immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/qnext-release.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF_NAME}"
          }
          EOF
          test -s dist/index.html
          test -s dist/qnext-release.json

      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: apps/workspace/dist/
          if-no-files-found: error
          retention-days: 14
