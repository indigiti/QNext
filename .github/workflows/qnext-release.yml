name: QNext Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qnext-release-main
  cancel-in-progress: true

jobs:
  build-release:
    name: Build DigiOps release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Vela workspace
        working-directory: apps/workspace
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run vela:parity
          npm run build

      - name: Build Ops Console
        working-directory: apps/ops-console
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Validate Ops PHP control plane
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/ops-console/public/api/index.php
          php -l apps/workspace/public/api/v1/_market_core_proxy.php
          php -l apps/workspace/public/api/v1/symbols/index.php
          php -l apps/workspace/public/api/v1/bars/index.php
          php -l apps/workspace/public/api/v1/calendar/index.php
          php -l apps/workspace/public/api/v1/feed-status/index.php
          php -l services/ops-api/public/index.php
          php -l services/ops-api/src/Auth.php
          php -l services/ops-api/src/OpsConfig.php
          php -l services/ops-api/src/ReleaseCatalog.php
          php -l services/ops-api/src/ServiceControl.php
          php -l services/ops-api/src/OpsController.php
          bash -n deploy/qnext-ops-user
          php services/ops-api/tests/smoke.php

          cron_root="$(mktemp -d)"
          mkdir -p "$cron_root/private/deploy"
          install -m 0640 deploy/qnext-ops-user "$cron_root/private/deploy/qnext-ops-user"
          /bin/bash "$cron_root/private/deploy/qnext-ops-user" reconcile
          test -s "$cron_root/run/cron-heartbeat"
          test "$(tr -d '\r\n' < "$cron_root/run/desired-state")" = "stopped"
          rm -rf "$cron_root"

          flat_root="$(mktemp -d)"
          mkdir -p "$flat_root/deploy" "$flat_root/bin"
          install -m 0640 deploy/qnext-ops-user "$flat_root/deploy/qnext-ops-user"
          touch "$flat_root/bin/qnext-market-core"
          /bin/bash "$flat_root/deploy/qnext-ops-user" reconcile
          test -s "$flat_root/run/cron-heartbeat"
          test "$(tr -d '\r\n' < "$flat_root/run/desired-state")" = "stopped"
          rm -rf "$flat_root"

          adopt_root="$(mktemp -d)"
          mkdir -p "$adopt_root/deploy" "$adopt_root/bin"
          install -m 0640 deploy/qnext-ops-user "$adopt_root/deploy/qnext-ops-user"
          install -m 0750 /bin/sleep "$adopt_root/bin/qnext-market-core"
          "$adopt_root/bin/qnext-market-core" 30 &
          orphan_pid=$!
          /bin/bash "$adopt_root/deploy/qnext-ops-user" status | grep -qx active
          test "$(cat "$adopt_root/run/market-core.pid")" = "$orphan_pid"
          /bin/bash "$adopt_root/deploy/qnext-ops-user" stop | grep -qx stopped
          if kill -0 "$orphan_pid" 2>/dev/null; then
            echo "adopted Market Core process was not stopped" >&2
            exit 1
          fi
          rm -rf "$adopt_root"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.sum

      - name: Build Linux Market Core
        working-directory: services/market-core
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          mkdir -p ../../build
          version="${GITHUB_SHA:0:12}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0             go build -trimpath             -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}"             -o ../../build/qnext-market-core             ./cmd/qnext-market-core

      - name: Validate deployed-binary restart
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$(mktemp -d)"
          mkdir -p "$runtime_root/deploy" "$runtime_root/bin"
          install -m 0750 deploy/qnext-ops-user "$runtime_root/deploy/qnext-ops-user"

          # Simulate the currently deployed legacy fixed-name binary.
          install -m 0750 build/qnext-market-core "$runtime_root/bin/qnext-market-core"
          /bin/bash "$runtime_root/deploy/qnext-ops-user" start | grep -qx active
          first_pid="$(cat "$runtime_root/run/market-core.pid")"
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18080/health >/dev/null

          # Simulate the new DigiOps contract: copy a new filename, then publish a tiny pointer.
          versioned="qnext-market-core-testv2"
          install -m 0750 build/qnext-market-core "$runtime_root/bin/$versioned"
          printf '%s\n' "$versioned" > "$runtime_root/bin/qnext-market-core.current"

          /bin/bash "$runtime_root/deploy/qnext-ops-user" reconcile | grep -qx active
          second_pid="$(cat "$runtime_root/run/market-core.pid")"
          test "$first_pid" != "$second_pid"
          test "$(readlink -f "/proc/$second_pid/exe")" = "$runtime_root/bin/$versioned"
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18080/health >/dev/null

          /bin/bash "$runtime_root/deploy/qnext-ops-user" stop | grep -qx stopped
          rm -rf "$runtime_root"

      - name: Assemble public/private release bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/public/admin
          mkdir -p release/private/bin release/private/config release/private/deploy

          cp -a apps/workspace/dist/. release/public/
          cp apps/workspace/public/.htaccess release/public/.htaccess
          cp -a apps/ops-console/dist/. release/public/admin/
          version="${GITHUB_SHA:0:12}"
          binary_name="qnext-market-core-${version}"
          install -m 0750 build/qnext-market-core "release/private/bin/${binary_name}"
          printf '%s\n' "${binary_name}" > release/private/bin/qnext-market-core.current
          cp -a services/ops-api release/private/ops-api

          cp config/q1-market.example.json release/private/config/q1-market.example.json
          cp config/q3-resilience.example.json release/private/config/q3-resilience.example.json
          cp config/q3-intelligence.example.json release/private/config/q3-intelligence.example.json

          install -m 0750 deploy/qnext-ops-helper release/private/deploy/qnext-ops-helper
          install -m 0750 deploy/qnext-ops-web release/private/deploy/qnext-ops-web
          install -m 0750 deploy/qnext-ops-user release/private/deploy/qnext-ops-user
          cp deploy/qnext-market-core.service release/private/deploy/
          cp deploy/qnext-ops.env.example release/private/deploy/
          cp deploy/qnext-runtime.env.example release/private/deploy/
          cp deploy/qnext-sudoers.example release/private/deploy/

          cat > release/release-manifest.json <<EOF
          {
            "schema": "QNEXT.RELEASE/1",
            "artifact": "digiops-release",
            "version": "${version}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF_NAME}",
            "public_prefix": "public",
            "private_prefix": "private",
            "routes": {
              "workspace": "/qnext/",
              "public_symbols": "/qnext/api/v1/symbols/",
              "public_bars": "/qnext/api/v1/bars/",
              "public_calendar": "/qnext/api/v1/calendar/",
              "public_feed_status": "/qnext/api/v1/feed-status/",
              "public_stream": "/qnext/api/v1/stream",
              "ops_console": "/qnext/admin/",
              "ops_api": "/qnext/admin/api/index.php"
            }
          }
          EOF

          cp release/release-manifest.json release/public/qnext-release.json

          test -s release/public/index.html
          test -f release/public/.htaccess
          grep -Fq 'ws://127.0.0.1:18080/api/v1/stream' release/public/.htaccess
          grep -Fq 'RewriteRule ^api/v1/stream/?          test -f release/public/api/v1/_market_core_proxy.php
          test -f release/public/api/v1/symbols/index.php
          test -f release/public/api/v1/bars/index.php
          test -f release/public/api/v1/calendar/index.php
          test -f release/public/api/v1/feed-status/index.php
          php -l release/public/api/v1/_market_core_proxy.php
          php -l release/public/api/v1/symbols/index.php
          php -l release/public/api/v1/bars/index.php
          php -l release/public/api/v1/calendar/index.php
          php -l release/public/api/v1/feed-status/index.php
          test -s release/public/admin/index.html
          test -f release/public/admin/api/index.php
          php -l release/public/admin/api/index.php
          test ! -e release/private/bin/qnext-market-core
          test -s "release/private/bin/qnext-market-core-${version}"
          test "$(cat release/private/bin/qnext-market-core.current)" = "qnext-market-core-${version}"
          test -f release/private/ops-api/public/index.php
          test -x release/private/deploy/qnext-ops-helper
          test -x release/private/deploy/qnext-ops-user
          test -s release/release-manifest.json

      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          retention-days: 14
 release/public/.htaccess
          test -f release/public/api/v1/_market_core_proxy.php
          test -f release/public/api/v1/symbols/index.php
          test -f release/public/api/v1/bars/index.php
          test -f release/public/api/v1/calendar/index.php
          test -f release/public/api/v1/feed-status/index.php
          php -l release/public/api/v1/_market_core_proxy.php
          php -l release/public/api/v1/symbols/index.php
          php -l release/public/api/v1/bars/index.php
          php -l release/public/api/v1/calendar/index.php
          php -l release/public/api/v1/feed-status/index.php
          test -s release/public/admin/index.html
          test -f release/public/admin/api/index.php
          php -l release/public/admin/api/index.php
          test ! -e release/private/bin/qnext-market-core
          test -s "release/private/bin/qnext-market-core-${version}"
          test "$(cat release/private/bin/qnext-market-core.current)" = "qnext-market-core-${version}"
          test -f release/private/ops-api/public/index.php
          test -x release/private/deploy/qnext-ops-helper
          test -x release/private/deploy/qnext-ops-user
          test -s release/release-manifest.json

      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          retention-days: 14
