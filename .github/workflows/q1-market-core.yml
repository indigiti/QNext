name: Q1 Market Core

on:
  pull_request:
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"
  push:
    branches:
      - "q1-*"
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Verify module files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Race + certification tests
        run: go test -race ./...

      - name: Build market core
        run: go build ./cmd/qnext-market-core

      - name: Capture module lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q1-market-core-go-sum
          path: services/market-core/go.sum
          if-no-files-found: ignore
