name: Q1 Market Core

on:
  pull_request:
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"
  push:
    branches:
      - "q1-*"
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.mod
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
