name: Q1 Market Core

on:
  pull_request:
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"
  push:
    branches:
      - q1-market-truth
    paths:
      - "services/market-core/**"
      - ".github/workflows/q1-market-core.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
