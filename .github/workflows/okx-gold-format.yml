name: OKX Gold branch formatting

on:
  push:
    branches:
      - feature/okx-xauusd-marketdata-20261123
    paths:
      - "services/market-core/**"
      - ".github/workflows/okx-gold-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/okx-xauusd-marketdata-20261123
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Format staged OKX code
        run: gofmt -w services/market-core/internal/provider/okx services/market-core/internal/candle/engine.go services/market-core/internal/candle/okx_24x7_test.go services/market-core/internal/marketcalendar/registry.go services/market-core/internal/marketcalendar/okx_24x7_test.go services/market-core/cmd/qnext-market-core/main.go services/market-core/cmd/qnext-market-core/okx_xauusd.go services/market-core/cmd/qnext-market-core/okx_admin_config.go services/market-core/cmd/qnext-market-core/okx_admin_config_test.go
      - name: Commit formatting (isolated feature branch)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/market-core; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style(okx): gofmt staged gold feed"
          git push origin HEAD:feature/okx-xauusd-marketdata-20261123
