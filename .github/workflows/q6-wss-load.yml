name: Q6 WSS Load Certification

on:
  pull_request:
    paths:
      - 'services/market-core/internal/stream/**'
      - '.github/workflows/q6-wss-load.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: services/market-core/go.sum

      - name: Resolve modules
        run: go mod download

      - name: Verify formatting
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet stream package
        run: go vet ./internal/stream

      - name: Slow-client protection regression
        run: go test ./internal/stream -run 'TestBroker(CoalescesFormingUpdatesForSlowSubscriber|ProtectsFinalCandleUnderFormingPressure|DisconnectsOnlyAfterProtectedQueueExhaustionAndReplayRecovers)|TestReplayRingRetainsNewestEventsInOrder' -count=1 -v

      - name: 100 to 1000 client websocket certification
        env:
          QNEXT_WSS_LOAD_CERT: '1'
        run: |
          ulimit -n 65535
          go test ./internal/stream -run '^TestWebSocketLoadCertification$' -count=1 -v -timeout=8m
