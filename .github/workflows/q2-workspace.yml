name: Q2 Workspace

on:
  pull_request:
    paths:
      - "apps/workspace/**"
      - "services/market-core/cmd/qnext-market-core/**"
      - "services/market-core/internal/authority/**"
      - "services/market-core/internal/httpapi/**"
      - "services/market-core/internal/marketcalendar/**"
      - "services/market-core/internal/symbol/**"
      - "docs/architecture/q2-workspace.md"
      - ".github/workflows/q2-workspace.yml"
  push:
    branches:
      - q2-workspace
    paths:
      - "apps/workspace/**"
      - "services/market-core/cmd/qnext-market-core/**"
      - "services/market-core/internal/authority/**"
      - "services/market-core/internal/httpapi/**"
      - "services/market-core/internal/marketcalendar/**"
      - "services/market-core/internal/symbol/**"
      - "docs/architecture/q2-workspace.md"
      - ".github/workflows/q2-workspace.yml"

jobs:
  market-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: services/market-core/go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Verify module files are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build market core
        run: go build ./cmd/qnext-market-core

  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Provider tests
        run: npm test

      - name: Vela runtime parity
        run: npm run vela:parity

      - name: Build static workspace
        run: npm run build

      - name: Validate chart-side PHP endpoints
        shell: bash
        run: |
          set -euo pipefail
          php -l public/api/v1/paper-markers/index.php
          php -l public/api/v1/intelligence-advisory/index.php
          test -f dist/api/v1/intelligence-advisory/index.php

      - name: Validate sanitized certified-advisory endpoint
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          exp="$root/storage/intelligence-lab/experiments/lab-certified-smoke"
          mkdir -p "$exp/advisory"
          cat > "$exp/manifest.json" <<'JSON'
          {
            "schema":"QNEXT.INTELLIGENCE.LAB/1",
            "experiment_id":"lab-certified-smoke",
            "name":"Certified smoke",
            "instrument_id":"NSE:NIFTY50",
            "timeframe":"1m",
            "indicator_ids":["ema-1"],
            "indicator_configuration_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "feature_schema_version":"qnext-chart-indicators-v2",
            "created_at_ms":1800000000000,
            "lifecycle_state":"CERTIFIED",
            "source":"MANUAL",
            "notes":""
          }
          JSON
          cat > "$exp/advisory/latest.json" <<'JSON'
          {
            "schema":"QNEXT.INTELLIGENCE.CERTIFIED_ADVISORY/1",
            "advisory_id":"adv-certified-smoke",
            "experiment_id":"lab-certified-smoke",
            "instrument_id":"NSE:NIFTY50",
            "timeframe":"1m",
            "indicator_configuration_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "feature_schema_version":"qnext-chart-indicators-v2",
            "certified_at_ms":1800000000000,
            "bar_time_ms":1800000060000,
            "as_of_time_ms":1800000120000,
            "created_at_ms":1800000121000,
            "model_algorithm":"qnext-ridge-direction-v1",
            "model_hash":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
            "decision":"BUY",
            "probabilities":{"BUY":0.7,"SELL":0.2,"NO_TRADE":0.1},
            "entry_price":100.0,
            "target1_price":101.0,
            "target2_price":102.0,
            "invalidation_price":99.0,
            "expected_return_pct":0.012,
            "expected_horizon_bars":3.0,
            "recommendation_policy_id":"rec-certified-smoke",
            "features":{"must_not":"leak"},
            "model_payload":{"must_not":"leak"}
          }
          JSON
          output="$(QNEXT_PRIVATE_ROOT="$root" php public/api/v1/intelligence-advisory/index.php)"
          php -r '
            $data=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            if (($data["available"] ?? false) !== true) exit(1);
            if (count($data["advisories"] ?? []) !== 1) exit(2);
            $item=$data["advisories"][0];
            if (($item["decision"] ?? "") !== "BUY") exit(3);
            if (isset($item["features"]) || isset($item["model_payload"])) exit(4);
            if (($item["instrumentId"] ?? "") !== "NSE:NIFTY50") exit(5);
          ' <<<"$output"
          rm -rf "$root"

      - name: Validate indicator deployment-root and Pine manifest
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/public_html/qnext/api/v1/indicators" "$root/private_html/qnext/config"
          cp public/api/v1/indicators/index.php "$root/public_html/qnext/api/v1/indicators/index.php"
          cat > "$root/private_html/qnext/config/qnext-indicators.json" <<'JSON'
          {
            "schema": "QNEXT.INDICATORS/1",
            "revision": 2,
            "indicators": [
              {
                "id": "adaptive-ema-qalg",
                "name": "Adaptive EMA [QALG]",
                "kind": "adaptive-ema-qalg",
                "enabled": true,
                "defaults": {}
              },
              {
                "id": "pine-ema-cross",
                "name": "Pine EMA Cross",
                "kind": "pine-v6",
                "enabled": true,
                "script": "//@version=6\nindicator(\"Pine EMA Cross\", overlay=true)\nplot(ta.ema(close, 9))"
              }
            ]
          }
          JSON
          output="$(env -u QNEXT_PRIVATE_ROOT php "$root/public_html/qnext/api/v1/indicators/index.php")"
          php -r '
            $data=json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            if (($data["indicators"][0]["name"] ?? "") !== "Adaptive EMA [QALG]") exit(1);
            if (($data["indicators"][1]["name"] ?? "") !== "Pine EMA Cross") exit(1);
            if (($data["indicators"][1]["language"] ?? "") !== "pine") exit(1);
            if (!str_contains((string) ($data["indicators"][1]["script"] ?? ""), "//@version=6")) exit(1);
          ' <<<"$output"
          rm -rf "$root"

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: apps/workspace/dist
          if-no-files-found: error

  q2-gate:
    runs-on: ubuntu-latest
    needs:
      - market-core
      - workspace
    steps:
      - name: Certify Q2 workspace
        run: echo "Q2_WORKSPACE_PASS"
