name: Q7 Foundation

on:
  pull_request:
    paths:
      - "scripts/release/**"
      - "services/market-core/**"
      - "apps/**/package*.json"
      - ".github/workflows/q7-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  locked-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [workspace, ops-console]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify committed lock and exact install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          sha256sum package-lock.json
