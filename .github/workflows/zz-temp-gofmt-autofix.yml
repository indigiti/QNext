name: Temporary gofmt autofix

on:
  push:
    branches:
      - fix-gofmt-multi-index

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gofmt-multi-index
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          cd services/market-core
          gofmt -w             cmd/qnext-market-core/main.go             internal/feedstatus/tracker.go             internal/feedstatus/tracker_test.go             internal/marketcalendar/registry.go             internal/marketconfig/config.go             internal/marketconfig/config_test.go             internal/provider/upstox/option_leg_resolver_test.go             internal/runtime/market_sink_test.go
          cd ../..
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "style: gofmt multi-index market changes"
          git push origin HEAD:fix-gofmt-multi-index
