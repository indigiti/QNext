name: Q7 gofmt repair

on:
  push:
    branches:
      - feat/q7-production-hardening-1
    paths:
      - .github/workflows/q7-gofmt-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/q7-production-hardening-1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Apply gofmt
        run: gofmt -w services/market-core
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/market-core; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/market-core
          git commit -m "chore(q7): apply gofmt"
          git push origin HEAD:feat/q7-production-hardening-1
